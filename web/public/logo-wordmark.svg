    Text scale = 20.82 / 72.8 = 0.2860
    Text block width = 410 × 0.2860 = 117.3px

    Icon right edge = 4 + 120×0.3462 = 4 + 41.5 = 45.5px
    Gap = 6px  →  text x-offset = 45.5 + 6 = 51.5 ≈ 52px
    Text y-offset = (48 - 20.82) / 2 = 13.6 ≈ 14px
    transform: translate(52,14) scale(0.2860)
  -->

