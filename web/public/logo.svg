<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="30" y1="20" x2="90" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8C96A"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A8852E"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="16" y1="8" x2="104" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8C96A"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon: flat-top orientation, centred at 60,60, radius ~56px -->
  <!-- Points at: top 60,8 | top-right 104,32 | bottom-right 104,88 | bottom 60,112 | bottom-left 16,88 | top-left 16,32 -->
  <polygon
    points="60,8 104,32 104,88 60,112 16,88 16,32"
    fill="#0D0D0D"
    stroke="url(#goldStroke)"
    stroke-width="2"
  />

  <!-- N mark — strokes inset from hex walls -->
  <!-- Left vertical: x=40, spans y=42 to y=78 -->
  <line x1="40" y1="42" x2="40" y2="78"
    stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Right vertical: x=80, spans y=42 to y=78 -->
  <line x1="80" y1="42" x2="80" y2="78"
    stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Diagonal: top-left (40,42) to bottom-right (80,78) -->
  <line x1="40" y1="42" x2="80" y2="78"
    stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Nexus nodes — junction points of the N -->
  <!-- Top-left junction -->
  <circle cx="40" cy="42" r="4" fill="#E8C96A" filter="url(#nodeGlow)"/>
  <!-- Center nexus point (midpoint of diagonal) -->
  <circle cx="60" cy="60" r="5" fill="#E8C96A" filter="url(#nodeGlow)"/>
  <!-- Bottom-right junction -->
  <circle cx="80" cy="78" r="4" fill="#C9A84C" filter="url(#nodeGlow)"/>
</svg>
